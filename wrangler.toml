name = "snapog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Stores users, API keys, and per-key usage counters.
[[d1_databases]]
binding = "DB"
database_name = "snapog-db"
database_id = "placeholder-set-after-wrangler-d1-create"

# Caches rendered OG images by request params so repeat requests skip re-render.
[[r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

# Daily at 03:00 UTC: reaps R2 cache objects untouched for 30+ days. The cache
# key is content-addressed (hash of free-text params), so without this the
# bucket grows forever — see src/lib/cache-sweep.ts.
[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "development"
# Set AUTH_SECRET via `wrangler secret put AUTH_SECRET` for dashboard cookie signing
#
# Stripe Checkout requires four secrets — set them with:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put STRIPE_PRICE_ID_PRO
#   wrangler secret put STRIPE_PRICE_ID_BUSINESS
# Never commit real values here — secrets are stored encrypted by Cloudflare,
# not in this file. Local dev/test envs run without them (routes that need
# them degrade to a 502/400 rather than crashing).

[env.staging]
name = "snapog-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "snapog"
[env.production.vars]
ENVIRONMENT = "production"
